  <text x="60" y="78" class="subtitle">Base layer with bilateral Home Row Mods. Hold home row keys for Ctrl/Alt/GUI/Shift. Number row from Go60 is</text>
  <text x="60" y="96" class="subtitle">moved to the Number layer (hold RET).</text>
